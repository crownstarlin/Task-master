<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Master — Complete</title><style>
:root{--bg:#080b10;--panel:#10151d;--panel2:#151c26;--text:#f6f8fb;--muted:#91a0b0;--line:#26303d;--accent:#f5c542;--green:#38d39f;--red:#ff7272;--blue:#78a9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.side{border-right:1px solid var(--line);padding:22px 14px;background:#0b1017;position:relative}.brand{display:flex;gap:10px;align-items:center;padding:4px 10px 25px}.logo{width:39px;height:39px;background:var(--accent);color:#111;border-radius:12px;display:grid;place-items:center;font-weight:900}.brand small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:var(--muted);padding:11px;border-radius:10px;text-align:left}.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text)}.sidefoot{position:absolute;left:14px;right:14px;bottom:18px}.main{padding:26px 32px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.eyebrow{font-size:11px;color:var(--accent);font-weight:800;letter-spacing:.15em}.top h1{margin:6px 0 3px;font-size:29px}.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 14px;border-radius:10px}.primary{background:var(--accent);color:#111;border-color:var(--accent);font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px}.num{font-size:26px;font-weight:850;margin-top:5px}.label{font-size:11px;color:var(--muted)}.layout{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-top:16px}.section{margin-top:16px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.tasks{display:grid;gap:8px}.task{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:13px;border-radius:12px}.check{width:21px;height:21px;border:1px solid #526070;background:transparent;border-radius:7px;color:#06130d}.check.done{background:var(--green);border-color:var(--green)}.taskbody{flex:1;min-width:0}.tasktitle{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.done .tasktitle{text-decoration:line-through;color:#71808f}.meta{font-size:10px;color:var(--muted);display:flex;gap:8px;margin-top:4px;align-items:center}.pill{padding:4px 7px;border-radius:6px;font-size:9px;font-weight:800}.high{background:#3b2025;color:#ff9999}.medium{background:#3a321c;color:#f1cf5b}.low{background:#173127;color:#70dfb0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.toolbar input,.toolbar select,.field input,.field select,.field textarea{background:#0c1219;color:var(--text);border:1px solid var(--line);padding:10px;border-radius:9px;outline:none}.toolbar input{flex:1;min-width:180px}.progress{height:7px;background:#222c38;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent)}.mini{font-size:11px;display:flex;justify-content:space-between;margin:7px 0}.list{display:grid;gap:9px}.item{padding:11px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:75px;border:1px solid var(--line);background:#0d131b;border-radius:9px;padding:7px;font-size:10px}.day b{font-size:11px}.event{display:block;background:#232d3a;border-radius:5px;padding:3px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.modal.show{display:flex}.dialog{width:min(600px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.form{display:grid;gap:11px}.field{display:grid;gap:6px}.field label{font-size:11px;color:var(--muted)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dialogactions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.chat{min-height:250px;max-height:380px;overflow:auto;background:#0c1219;border:1px solid var(--line);padding:12px;border-radius:12px}.bubble{padding:9px 11px;border-radius:11px;margin:7px 0;max-width:85%;font-size:12px}.bot{background:#1a222d}.user{background:#2d2815;margin-left:auto}.chatrow{display:flex;gap:8px;margin-top:8px}.chatrow input{flex:1;background:#0c1219;color:var(--text);border:1px solid var(--line);padding:10px;border-radius:9px}@media(max-width:900px){.app{grid-template-columns:70px 1fr}.brand span,.nav span,.sidefoot{display:none}.brand{justify-content:center}.nav button{text-align:center}.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.app{display:block}.side{display:none}.main{padding:17px 12px}.top{display:block}.actions{margin-top:12px}.grid{gap:7px}.card{padding:12px}.row{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">TM</div><div><b>Task Master</b><small>PLAN • EXECUTE • WIN</small></div></div><nav class="nav"><button class="active" data-view="dashboard">◈ <span>Dashboard</span></button><button data-view="tasks">☷ <span>All Tasks</span></button><button data-view="today">◷ <span>Today</span></button><button data-view="calendar">▦ <span>Calendar</span></button><button data-view="projects">▣ <span>Projects</span></button><button data-view="goals">🎯 <span>Goals</span></button><button data-view="analytics">↗ <span>Analytics</span></button><button data-view="ai">✦ <span>AI Assistant</span></button><button data-view="settings">⚙ <span>Settings</span></button></nav><div class="sidefoot card"><div class="label">Today's progress</div><div class="mini"><b id="miniPct">0%</b><b id="miniCount">0/0</b></div><div class="progress"><span id="miniBar" style="width:0%"></span></div></div></aside><main class="main"><div class="top"><div><div class="eyebrow">TASK MASTER • COMPLETE EDITION</div><h1 id="greeting">Good morning 👋</h1><div class="muted">Plan your day, execute your priorities, and track the wins.</div></div><div class="actions"><button class="btn" id="notify">🔔 Reminders</button><button class="btn primary" id="newTask">+ New task</button></div></div><div id="content"></div></main></div><div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">Create task</h2><form class="form" id="taskForm"><div class="field"><label>Task name</label><input id="title" required placeholder="What needs to get done?"></div><div class="row"><div class="field"><label>Due date</label><input id="date" type="date" required></div><div class="field"><label>Priority</label><select id="priority"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></div></div><div class="row"><div class="field"><label>Category</label><input id="category" placeholder="School, Trading, Business..."></div><div class="field"><label>Project</label><select id="project"></select></div></div><div class="row"><div class="field"><label>Repeat</label><select id="repeat"><option value="none">Does not repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></div><div class="field"><label>Estimated minutes</label><input id="minutes" type="number" min="5" value="30"></div></div><div class="field"><label>Notes</label><textarea id="notes" rows="3" placeholder="Details, checklist, context..."></textarea></div><div class="dialogactions"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary">Save task</button></div></form></div></div>
<script>
const KEY='taskmaster_complete_v1';let data=JSON.parse(localStorage.getItem(KEY)||'null')||{tasks:[{id:1,title:'Review today’s priorities',date:today(),priority:'high',category:'Personal',project:'Personal',repeat:'none',minutes:15,notes:'',done:false},{id:2,title:'Study for upcoming class',date:today(),priority:'medium',category:'School',project:'Study',repeat:'none',minutes:60,notes:'',done:false},{id:3,title:'Review trading journal',date:today(),priority:'low',category:'Trading',project:'Trading',repeat:'none',minutes:30,notes:'',done:true}],projects:['Personal','Study','Trading','Business'],goals:[{id:1,name:'Build a consistent daily routine',target:20,done:7},{id:2,name:'Finish this month’s school work',target:10,done:4}],settings:{theme:'dark',name:'User'}};let view='dashboard';function today(){return new Date().toISOString().slice(0,10)}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function stats(){let t=data.tasks,c=t.filter(x=>x.done).length;return{total:t.length,done:c,today:t.filter(x=>x.date===today()&&!x.done).length,pct:t.length?Math.round(c/t.length*100):0}}function taskHtml(t){return `<div class="task ${t.done?'done':''}"><button class="check ${t.done?'done':''}" onclick="toggle(${t.id})">${t.done?'✓':''}</button><div class="taskbody"><div class="tasktitle">${esc(t.title)}</div><div class="meta"><span>${esc(t.category||'General')}</span><span>•</span><span>${t.date===today()?'Today':esc(t.date)}</span><span>•</span><span>${t.minutes||30}m</span><span class="pill ${t.priority}">${t.priority}</span></div></div><button class="btn" style="padding:5px 8px" onclick="editTask(${t.id})">Edit</button><button class="btn" style="padding:5px 8px" onclick="removeTask(${t.id})">×</button></div>`}function header(title,sub=''){return `<div class="sectionhead"><div><h2>${title}</h2>${sub?`<div class="muted" style="font-size:11px">${sub}</div>`:''}</div></div>`}function dashboard(){let s=stats(),list=data.tasks.filter(t=>t.date===today()).slice(0,8),high=data.tasks.filter(t=>t.priority==='high'&&!t.done).slice(0,5);return `<div class="grid"><div class="card"><div class="label">Total tasks</div><div class="num">${s.total}</div></div><div class="card"><div class="label">Due today</div><div class="num">${s.today}</div></div><div class="card"><div class="label">Completed</div><div class="num">${s.done}</div></div><div class="card"><div class="label">Overall progress</div><div class="num">${s.pct}%</div></div></div><div class="layout"><section class="section">${header('Today’s tasks','Your next actions')}<div class="tasks">${list.length?list.map(taskHtml).join(''):'<div class="card muted">No tasks today.</div>'}</div></section><section class="section">${header('Priority focus','High-priority unfinished work')}<div class="card">${high.length?high.map(t=>`<div class="item"><b>${esc(t.title)}</b><span class="pill high">HIGH</span></div>`).join(''):'<div class="muted">Nothing urgent right now.</div>'}</div><div class="card" style="margin-top:10px"><b>Daily progress</b><div class="mini"><span>Completed</span><span>${s.done}/${s.total}</span></div><div class="progress"><span style="width:${s.pct}%"></span></div></div></section></div>`}function tasksView(){return `<div class="toolbar"><input id="search" placeholder="Search tasks..."><select id="filter"><option value="all">All</option><option value="open">Open</option><option value="done">Completed</option><option value="high">High priority</option></select><button class="btn primary" onclick="openNew()">+ Add</button></div><div class="tasks" id="filtered"></div>`}function renderTasks(){let q=(document.getElementById('search')?.value||'').toLowerCase(),f=document.getElementById('filter')?.value||'all';let a=data.tasks.filter(t=>(!q||t.title.toLowerCase().includes(q)||t.category.toLowerCase().includes(q))&&(f==='all'||(f==='open'&&!t.done)||(f==='done'&&t.done)||(f==='high'&&t.priority==='high')));document.getElementById('filtered').innerHTML=a.length?a.map(taskHtml).join(''):'<div class="card muted">No matching tasks.</div>'}function calendar(){let d=new Date(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),cells='';for(let i=0;i<first;i++)cells+='<div></div>';for(let n=1;n<=days;n++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,ts=data.tasks.filter(t=>t.date===ds);cells+=`<div class="day"><b>${n}</b>${ts.slice(0,3).map(t=>`<span class="event">${esc(t.title)}</span>`).join('')}</div>`}return `${header('Calendar','Tasks across this month')}<div class="card"><div class="calendar">${cells}</div></div>`}function projects(){return `${header('Projects','Organize workspaces and task streams')}<div class="grid">${data.projects.map(p=>{let a=data.tasks.filter(t=>t.project===p),d=a.filter(t=>t.done).length,pct=a.length?Math.round(d/a.length*100):0;return `<div class="card"><b>${esc(p)}</b><div class="muted" style="font-size:11px;margin:7px 0">${a.length} tasks</div><div class="progress"><span style="width:${pct}%"></span></div><div class="mini"><span>Progress</span><b>${pct}%</b></div></div>`}).join('')}</div>`}function goals(){return `${header('Goals','Long-term targets broken into measurable progress')}<div class="tasks">${data.goals.map(g=>{let p=Math.min(100,Math.round(g.done/g.target*100));return `<div class="card"><div style="display:flex;justify-content:space-between"><b>${esc(g.name)}</b><b>${g.done}/${g.target}</b></div><div class="progress" style="margin-top:10px"><span style="width:${p}%"></span></div><div class="actions" style="margin-top:10px"><button class="btn" onclick="goal(${g.id},-1)">−</button><button class="btn" onclick="goal(${g.id},1)">+ progress</button></div></div>`}).join('')}</div>`}function analytics(){let s=stats(),by={high:0,medium:0,low:0};data.tasks.forEach(t=>by[t.priority]++);return `${header('Analytics','Your productivity snapshot')}<div class="grid"><div class="card"><div class="label">Completion rate</div><div class="num">${s.pct}%</div></div><div class="card"><div class="label">Open tasks</div><div class="num">${s.total-s.done}</div></div><div class="card"><div class="label">High priority</div><div class="num">${by.high}</div></div><div class="card"><div class="label">Estimated workload</div><div class="num">${data.tasks.filter(t=>!t.done).reduce((a,t)=>a+(+t.minutes||0),0)}m</div></div></div><div class="card" style="margin-top:16px"><b>Priority distribution</b>${Object.entries(by).map(([k,v])=>`<div class="mini" style="margin-top:14px"><span>${k}</span><b>${v}</b></div><div class="progress"><span style="width:${s.total?Math.round(v/s.total*100):0}%"></span></div>`).join('')}</div>`}function ai(){return `${header('AI Assistant','A local demo assistant — no external AI connection required')}<div class="card"><div class="chat" id="chat"><div class="bubble bot">Hi! I’m Task Master AI. Ask me to plan your day, break down a goal, or summarize your workload.</div></div><div class="chatrow"><input id="aiInput" placeholder="e.g. Plan my day"><button class="btn primary" onclick="askAI()">Send</button></div></div>`}function settings(){return `${header('Settings','Customize your workspace')}<div class="card"><div class="field"><label>Your display name</label><input id="nameSet" value="${esc(data.settings.name)}"></div><div class="field" style="margin-top:10px"><label>Appearance</label><select id="themeSet"><option value="dark">Dark</option><option value="light">Light</option></select></div><div class="actions" style="margin-top:15px"><button class="btn primary" onclick="saveSettings()">Save settings</button><button class="btn" onclick="exportData()">Export data</button><button class="btn" onclick="resetData()">Reset demo data</button></div></div>`}function render(){let s=stats();document.getElementById('miniPct').textContent=s.pct+'%';document.getElementById('miniCount').textContent=s.done+'/'+s.total;document.getElementById('miniBar').style.width=s.pct+'%';let html=view==='dashboard'?dashboard():view==='tasks'?tasksView():view==='today'?`${header('Today','Everything scheduled for today')}<div class="tasks">${data.tasks.filter(t=>t.date===today()).map(taskHtml).join('')||'<div class="card muted">Nothing scheduled today.</div>'}</div>`:view==='calendar'?calendar():view==='projects'?projects():view==='goals'?goals():view==='analytics'?analytics():view==='ai'?ai():settings();document.getElementById('content').innerHTML=html;if(view==='tasks'){document.getElementById('search').oninput=renderTasks;document.getElementById('filter').onchange=renderTasks;renderTasks()}if(view==='settings')document.getElementById('themeSet').value=data.settings.theme}function openNew(){document.getElementById('modalTitle').textContent='Create task';document.getElementById('taskForm').dataset.edit='';fillProjects();document.getElementById('date').value=today();document.getElementById('modal').classList.add('show');document.getElementById('title').focus()}function fillProjects(){document.getElementById('project').innerHTML=data.projects.map(p=>`<option>${esc(p)}</option>`).join('')}window.editTask=id=>{let t=data.tasks.find(x=>x.id===id);if(!t)return;document.getElementById('modalTitle').textContent='Edit task';document.getElementById('taskForm').dataset.edit=id;fillProjects();['title','date','priority','category','project','repeat','minutes','notes'].forEach(k=>document.getElementById(k).value=t[k]??'');document.getElementById('modal').classList.add('show')};window.toggle=id=>{let t=data.tasks.find(x=>x.id===id);if(t)t.done=!t.done;save();render()};window.removeTask=id=>{data.tasks=data.tasks.filter(x=>x.id!==id);save();render()};window.goal=(id,n)=>{let g=data.goals.find(x=>x.id===id);if(g)g.done=Math.max(0,g.done+n);save();render()};document.getElementById('newTask').onclick=openNew;document.getElementById('cancel').onclick=()=>document.getElementById('modal').classList.remove('show');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')document.getElementById('modal').classList.remove('show')};document.getElementById('taskForm').onsubmit=e=>{e.preventDefault();let id=e.target.dataset.edit,t={id:id?+id:Date.now(),title:title.value.trim(),date:date.value,priority:priority.value,category:category.value.trim()||'General',project:project.value,repeat:repeat.value,minutes:+minutes.value||30,notes:notes.value,done:false};if(id){let old=data.tasks.find(x=>x.id===+id);t.done=old.done;data.tasks=data.tasks.map(x=>x.id===+id?t:x)}else data.tasks.unshift(t);save();document.getElementById('modal').classList.remove('show');e.target.reset();render()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});function askAI(){let input=document.getElementById('aiInput'),q=input.value.trim();if(!q)return;let chat=document.getElementById('chat');chat.innerHTML+=`<div class="bubble user">${esc(q)}</div>`;let s=stats(),open=data.tasks.filter(t=>!t.done).sort((a,b)=>({high:0,medium:1,low:2}[a.priority]-({high:0,medium:1,low:2}[b.priority])));let ans=q.toLowerCase().includes('plan')?`You have ${s.today} open task(s) due today. Start with: ${open.slice(0,3).map(t=>t.title).join(', ')||'nothing urgent'}. Try a focused 25–50 minute work block, then review your progress.`:q.toLowerCase().includes('break')?`Break the goal into: 1) define the outcome, 2) list the smallest actions, 3) schedule the first action, 4) complete and review. Tell me the goal and I can turn it into task ideas.`:`You have ${s.total-s.done} open tasks and ${s.done} completed. I can help plan, prioritize, or break down your work.`;chat.innerHTML+=`<div class="bubble bot">${esc(ans)}</div>`;input.value='';chat.scrollTop=chat.scrollHeight}document.getElementById('notify').onclick=()=>{if('Notification'in window){Notification.requestPermission().then(p=>alert(p==='granted'?'Reminders enabled for this browser.':'Permission not granted.'))}else alert('Browser notifications are not supported here.')};window.saveSettings=()=>{data.settings.name=document.getElementById('nameSet').value.trim()||'User';data.settings.theme=document.getElementById('themeSet').value;save();alert('Settings saved.');render()};window.exportData=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='task-master-backup.json';a.click()};window.resetData=()=>{if(confirm('Reset all Task Master demo data?')){localStorage.removeItem(KEY);location.reload()}};let h=new Date().getHours();document.getElementById('greeting').textContent=(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+' 👋';render();
</script></body></html>
